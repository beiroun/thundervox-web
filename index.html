<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Self-hosted fonts (@font-face in src/theme/fonts.css). Preload the faces the first paint needs - the
         wordmark and the body in both scripts, the audience is bilingual - so the header never flashes a system
         fallback. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/clash-display.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/onest-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/onest-cyrillic.woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#212842" />
    <!-- An operator console behind a login: it has nothing to offer a crawler and should not be findable. The
         social and structured-data tags below are for link previews and the browser, not for search. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Operator console of the ThunderVox SIP endpoint platform by 84softworks: SIP numbers of intercom panels and subscribers, registrations, console users and the audit trail."
    />
    <meta name="application-name" content="ThunderVox Console" />
    <meta name="apple-mobile-web-app-title" content="ThunderVox" />
    <link rel="canonical" href="https://console.thundervox.ru/" />

    <!-- Favicons / app icons - the 84softworks set: one round icon everywhere (no per-browser JS), a navy disc
         inside a bright orange ring with the bolt, transparent corners. The ring lifts the icon's contrast so
         Safari (16.4+) doesn't paint its white "low-contrast" card behind the dark navy mark. favicon.ico is
         BMP/DIB-encoded (16/32/48), NOT PNG-in-ICO, which Safari's ICO decoder can't read. The 96×96 PNG is the
         size Google and link previews pick up. apple-touch stays an opaque square that iOS masks to a squircle
         (transparent corners would fill black there). ?v= busts Safari/Firefox's very sticky favicon cache when
         the art changes - bump it on the next icon edit. Generated by brand/make_icons.py in the mirror. -->
    <link rel="icon" href="/favicon.ico?v=1" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph: what a messenger shows when the console link is pasted -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ThunderVox" />
    <meta property="og:title" content="ThunderVox Console" />
    <meta property="og:description" content="Operator console of the ThunderVox SIP endpoint platform by 84softworks." />
    <meta property="og:url" content="https://console.thundervox.ru/" />
    <meta property="og:image" content="https://console.thundervox.ru/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ThunderVox by 84softworks – SIP endpoint platform, operator console" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThunderVox Console" />
    <meta name="twitter:description" content="Operator console of the ThunderVox SIP endpoint platform by 84softworks." />
    <meta name="twitter:image" content="https://console.thundervox.ru/og-image.png" />

    <!-- Structured data: the site name for browsers and previews, and the organization behind the product -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ThunderVox Console",
        "url": "https://console.thundervox.ru/",
        "publisher": { "@type": "Organization", "name": "84softworks", "url": "https://84softworks.com/" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "84softworks",
        "url": "https://84softworks.com/",
        "logo": "https://84softworks.com/favicon-96x96.png",
        "founder": { "@type": "Person", "name": "Andrei Baranov", "url": "https://github.com/beiroun" }
      }
    </script>

    <!-- Applies the saved colour scheme before React mounts (what Mantine's ColorSchemeScript renders), so a
         dark console never flashes white. Same storage key and default ("auto") as MantineProvider in main.tsx. -->
    <script>
      try {
        var storedScheme = window.localStorage.getItem('mantine-color-scheme-value');
        var scheme = storedScheme === 'light' || storedScheme === 'dark' || storedScheme === 'auto' ? storedScheme : 'auto';
        var computedScheme =
          scheme !== 'auto' ? scheme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', computedScheme);
      } catch (e) {}
    </script>

    <!-- Replaced per route and language by useDocumentTitle(); this value is what a cold load shows first -->
    <title>ThunderVox Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
