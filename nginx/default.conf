#
# Console: static SPA plus /api proxied to thundervox-server on the same host (compose runs everything with
# network_mode: host, so 127.0.0.1:8080 is the server).
#
# Port 8081, not 80: TLS and the public name belong to the edge proxy, which terminates HTTPS for
# console.<domain> and forwards here over loopback. Nothing in this container faces the internet, so it needs
# no certificate and no redirect of its own.
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An operator console is not a search result; the meta tag in index.html says the same for the SPA shell
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The internal API is for the SIP core on loopback only (X-CORE-TOKEN): never reachable through the console
    location /api/v1/internal/ {
        return 404;
    }

    # The server owns everything under /api (context path /api/v1); the URI is passed through unchanged
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change: cache them for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes resolve to the SPA entry point
    location / {
        try_files $uri $uri/ /index.html;
    }
}
